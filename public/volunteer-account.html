<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب المتطوع - روح</title>

<style>
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f7f7f2;
 color:#263746;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
}

.card{
 width:min(850px,92%);
 background:white;
 border-radius:24px;
 padding:40px;
 box-shadow:0 15px 50px rgba(0,0,0,.08);
 text-align:center;
}

.logo{
 font-size:42px;
 font-weight:bold;
 margin-bottom:8px;
}

.logo span{
 font-size:28px;
}

h1{
 margin:10px 0;
}

.info{
 margin:25px 0;
 text-align:right;
 background:#f5f5ef;
 padding:20px;
 border-radius:16px;
}

.info div{
 margin:12px 0;
}

.label{
 font-weight:bold;
}

button{
 border:0;
 border-radius:12px;
 padding:13px 25px;
 cursor:pointer;
 font-size:16px;
}

.logout{
 background:#d9534f;
 color:white;
}

.back{
 margin-top:12px;
 background:#5c8567;
 color:white;
}

.section{
 margin-top:24px;
 text-align:right;
 background:#f5f5ef;
 padding:20px;
 border-radius:16px;
}

.section h2{
 margin-top:0;
}

.adminItem,
.workItem{
 background:white;
 border-radius:14px;
 padding:15px;
 margin:10px 0;
}

.workItem a{
 color:#3d7150;
 font-weight:bold;
 text-decoration:none;
}

.muted{
 color:#6f7b83;
 font-size:14px;
}


.welcomeCard{
 margin:18px 0 22px;
 padding:22px 24px;
 border-radius:22px;
 background:linear-gradient(135deg,rgba(24,94,66,.14),rgba(255,255,255,.95));
 border:1px solid rgba(24,94,66,.15);
 box-shadow:0 12px 35px rgba(0,0,0,.06);
 animation:welcomeIn .55s ease both;
}

.welcomeCard h2{
 margin:0 0 7px;
 font-size:28px;
}

.welcomeCard p{
 margin:0;
 opacity:.75;
 font-size:15px;
}

@keyframes welcomeIn{
 from{
  opacity:0;
  transform:translateY(-12px);
 }
 to{
  opacity:1;
  transform:translateY(0);
 }
}

</style>
</head>

<body>

<div id="welcomeCard" class="welcomeCard" style="display:none">
 <h2 id="welcomeTitle"></h2>
 <p id="welcomeText"></p>
</div>

<div class="card">

<div class="logo">🌱 روح</div>

<h1>أهلًا وسهلًا فيك 👋</h1>

<p>حساب المتطوع</p>

<div id="loading">
جارٍ تحميل بياناتك...
</div>

<div id="account" style="display:none">

<div class="info">

<div>
<span class="label">الاسم:</span>
<span id="name"></span>
</div>

<div>
<span class="label">اسم المستخدم:</span>
<span id="username"></span>
</div>

<div>
<span class="label">البريد الإلكتروني:</span>
<span id="email"></span>
</div>

<div>
<span class="label">رقم الهاتف:</span>
<span id="phone"></span>
</div>

<div>
<span class="label">القسم:</span>
<span id="department"></span>
</div>

</div>

<div class="section">
<h2>👤 مسؤولو قسمي</h2>
<div id="departmentAdmins">
جارٍ التحميل...
</div>
</div>

<div class="section">
<h2>📂 محتوى قسمي</h2>
<div id="departmentWork">
جارٍ التحميل...
</div>
</div>

<button class="logout" id="logout">
تسجيل الخروج
</button>

<br>

<button class="back" onclick="location.href='/'">
العودة إلى موقع روح
</button>

</div>




<div id="message"></div>


</div>

<script>

function escapeHtml(value){
 return String(value??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#39;");
}


async function loadAccount(){

 try{

  const response=await fetch('/api/volunteer/me');
  const data=await response.json();

  if(!data.volunteer){
   window.location.href='/volunteer-login';
   return;
  }

  const v=data.volunteer;

  const welcomeCard=document.getElementById('welcomeCard');
  const welcomeTitle=document.getElementById('welcomeTitle');
  const welcomeText=document.getElementById('welcomeText');

  if(welcomeCard && welcomeTitle && welcomeText){
   const firstName=String(v.name||'').trim().split(/\s+/)[0] || 'صديق روح';

   welcomeTitle.textContent=`أهلًا بعودتك يا ${firstName} 👋`;
   welcomeText.textContent=v.department
    ? `جاهز تترك أثر اليوم؟ 💚 أنت ضمن قسم ${v.department}`
    : 'جاهز تترك أثر اليوم؟ 💚';

   welcomeCard.style.display='block';
  }

  document.getElementById('name').textContent=v.name||'';
  document.getElementById('username').textContent=v.username||'';
  document.getElementById('email').textContent=v.email||'';
  document.getElementById('phone').textContent=v.phone||'';

  const departmentEl=document.getElementById('department');
  if(departmentEl){
   departmentEl.textContent=v.department||'لم يتم تحديد القسم';
  }

  try{
   const depResponse=
    await fetch('/api/volunteer/department');

   const depData=
    await depResponse.json();

   const adminsEl=
    document.getElementById('departmentAdmins');

   const workEl=
    document.getElementById('departmentWork');

   if(depResponse.ok){
    adminsEl.innerHTML=
     depData.admins.length
      ? depData.admins.map(a=>
         `<div class="adminItem">👤 ${escapeHtml(a.name)}</div>`
        ).join('')
      : '<div class="muted">لم يتم تحديد مسؤول للقسم.</div>';

    workEl.innerHTML=
     depData.items.length
      ? depData.items.map(x=>`
       <div class="workItem">
        <strong>${escapeHtml(x.title)}</strong>

        ${
         x.description
          ? `<p>${escapeHtml(x.description)}</p>`
          : ''
        }

        ${
         x.link_url
          ? `<p>
              <a href="${escapeHtml(x.link_url)}"
               target="_blank"
               rel="noopener">
               🔗 فتح المرفق / الرابط
              </a>
             </p>`
          : ''
        }

        <div class="muted">
         بواسطة:
         ${escapeHtml(x.created_by_name||'مسؤول القسم')}
        </div>
       </div>
      `).join('')
      : '<div class="muted">لا يوجد محتوى للقسم بعد.</div>';
   }

  }catch(e){
   document.getElementById('departmentAdmins').textContent=
    'تعذر تحميل مسؤولي القسم.';

   document.getElementById('departmentWork').textContent=
    'تعذر تحميل محتوى القسم.';
  }

  document.getElementById('loading').style.display='none';
  document.getElementById('account').style.display='block';

 }catch(error){

  document.getElementById('loading').textContent=
   'تعذر تحميل بيانات الحساب.';

 }

}

document.getElementById('logout').addEventListener('click',async()=>{

 await fetch('/api/volunteer/logout',{
  method:'POST'
 });

 window.location.href='/volunteer-login';

});

loadAccount();

</script>

</body>
</html>
