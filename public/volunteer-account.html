<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب المتطوع - روح</title>

<style>
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f7f7f2;
 color:#263746;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
}

.card{
 width:min(520px,90%);
 background:white;
 border-radius:24px;
 padding:40px;
 box-shadow:0 15px 50px rgba(0,0,0,.08);
 text-align:center;
}

.logo{
 font-size:42px;
 font-weight:bold;
 margin-bottom:8px;
}

.logo span{
 font-size:28px;
}

h1{
 margin:10px 0;
}

.info{
 margin:25px 0;
 text-align:right;
 background:#f5f5ef;
 padding:20px;
 border-radius:16px;
}

.info div{
 margin:12px 0;
}

.label{
 font-weight:bold;
}

button{
 border:0;
 border-radius:12px;
 padding:13px 25px;
 cursor:pointer;
 font-size:16px;
}

.logout{
 background:#d9534f;
 color:white;
}

.back{
 margin-top:12px;
 background:#5c8567;
 color:white;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">🌱 روح</div>

<h1>أهلًا وسهلًا فيك 👋</h1>

<p>حساب المتطوع</p>

<div id="loading">
جارٍ تحميل بياناتك...
</div>

<div id="account" style="display:none">

<div class="info">

<div>
<span class="label">الاسم:</span>
<span id="name"></span>
</div>

<div>
<span class="label">اسم المستخدم:</span>
<span id="username"></span>
</div>

<div>
<span class="label">البريد الإلكتروني:</span>
<span id="email"></span>
</div>

<div>
<span class="label">رقم الهاتف:</span>
<span id="phone"></span>
</div>

<div>
<span class="label">القسم:</span>
<span id="department"></span>
</div>

</div>

<button class="logout" id="logout">
تسجيل الخروج
</button>

<br>

<button class="back" onclick="location.href='/'">
العودة إلى موقع روح
</button>

</div>

<div id="message"></div>

</div>

<script>

async function loadAccount(){

 try{

  const response=await fetch('/api/volunteer/me');
  const data=await response.json();

  if(!data.volunteer){
   window.location.href='/volunteer-login';
   return;
  }

  const v=data.volunteer;

  document.getElementById('name').textContent=v.name||'';
  document.getElementById('username').textContent=v.username||'';
  document.getElementById('email').textContent=v.email||'';
  document.getElementById('phone').textContent=v.phone||'';

  const departmentEl=document.getElementById('department');
  if(departmentEl){
   departmentEl.textContent=v.department||'لم يتم تحديد القسم';
  }

  document.getElementById('loading').style.display='none';
  document.getElementById('account').style.display='block';

 }catch(error){

  document.getElementById('loading').textContent=
   'تعذر تحميل بيانات الحساب.';

 }

}

document.getElementById('logout').addEventListener('click',async()=>{

 await fetch('/api/volunteer/logout',{
  method:'POST'
 });

 window.location.href='/volunteer-login';

});

loadAccount();

</script>

</body>
</html>
